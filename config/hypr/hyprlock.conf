general {
    hide_cursor = true
}

background {
    path = ~/Pictures/wallpapers/nord-escuro.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(d8dee9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B"
    color = rgb(81a1c1)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 300, 52
    outline_thickness = 2
    outer_color = rgb(88c0d0) rgb(5e81ac) 45deg
    inner_color = rgb(11141a)
    font_color = rgb(d8dee9)
    check_color = rgb(ebcb8b)
    fail_color = rgb(bf616a)
    placeholder_text = <i>senha...</i>
    fail_text = senha errada
    rounding = 14
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
