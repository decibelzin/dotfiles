# ── Nord Escuro · kitty ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5

window_padding_width 14
background_opacity   0.6
# Fechar a janela inteira (botão vermelho) com 2+ abas pede confirmação.
# Pra fechar só uma aba: clique com o botão do meio nela (touchpad: toque
# com 3 dedos), Ctrl+Shift+Q, ou digite exit
confirm_os_window_close 2
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.6

tab_bar_style powerline
tab_powerline_style slanted

foreground            #d8dee9
background            #0c0f14
selection_foreground  #0c0f14
selection_background  #88c0d0
cursor                #d8dee9
cursor_text_color     #0c0f14
url_color             #88c0d0

active_border_color   #88c0d0
inactive_border_color #2a303b
active_tab_foreground   #0c0f14
active_tab_background   #88c0d0
inactive_tab_foreground #9aa5b8
inactive_tab_background #1a1e26

# preto
color0  #1a1e26
color8  #4c566a
# vermelho
color1  #bf616a
color9  #bf616a
# verde
color2  #a3be8c
color10 #a3be8c
# amarelo
color3  #ebcb8b
color11 #ebcb8b
# azul
color4  #81a1c1
color12 #81a1c1
# magenta
color5  #b48ead
color13 #b48ead
# ciano
color6  #88c0d0
color14 #8fbcbb
# branco
color7  #d8dee9
color15 #eceff4

# Controle remoto só por um arquivo do seu usuário (/run/user/1000, ninguém mais
# acessa): o ~/.config/hypr/scripts/sessao.py pergunta as abas abertas (pasta,
# título, o que roda) pra reabrir igual no próximo login
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# ── Copiar/colar fácil ─────────────────────────────────
# Selecionou com o mouse = já copiou (vai pro Ctrl+V dos outros apps também)
copy_on_select clipboard
# Botão direito cola (igual terminal do Windows); Ctrl+Shift+V também cola
mouse_map right press ungrabbed paste_from_clipboard
